# SentinelLake - full stack.
#
#   docker compose up -d --build                     streaming stack (~6.5 GB RAM)
#   docker compose --profile batch up -d             + YARN, MapReduce history, Hive (~+3 GB)
#
# Web UIs: dashboard :8000 | HDFS :9870 | Spark :8080 | YARN :8088 | Job history :19888 | Hive :10002

x-hadoop: &hadoop
  build: ./docker/hadoop
  image: sentinellake/hadoop:3.3.6
  volumes:
    - ./:/opt/sentinellake:ro
  restart: unless-stopped

x-spark: &spark
  build: { context: ., dockerfile: docker/spark.Dockerfile }
  image: sentinellake/spark:3.5.3

x-app: &app
  build: { context: ., dockerfile: docker/app.Dockerfile }
  image: sentinellake/app:1.0

services:
  # ---------- ingestion ----------
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # KRaft mode: no ZooKeeper
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on: { kafka: { condition: service_healthy } }
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
      --topic api-logs --partitions 6 --replication-factor 1
      --config retention.ms=86400000 --config compression.type=producer
    restart: "no"

  generator:
    <<: *app
    depends_on: { kafka-init: { condition: service_completed_successfully } }
    command: python -m sentinellake.generator live --bootstrap kafka:9092 --rps 100 --demo
    restart: unless-stopped

  # ---------- storage: HDFS ----------
  namenode:
    <<: *hadoop
    hostname: namenode
    command: namenode
    ports: ["9870:9870"]
    volumes:
      - ./:/opt/sentinellake:ro
      - namenode:/data

  datanode:
    <<: *hadoop
    hostname: datanode
    command: datanode
    depends_on: [namenode]
    volumes:
      - datanode:/data

  hdfs-init:
    <<: *hadoop
    command: hdfs-init
    depends_on: [datanode]
    restart: "no"

  # ---------- processing: Spark ----------
  spark-master:
    <<: *spark
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports: ["8080:8080"]

  spark-worker:
    <<: *spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1536m
    depends_on: [spark-master]

  stream:
    <<: *spark
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      hdfs-init: { condition: service_completed_successfully }
      cassandra-init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      spark-worker: { condition: service_started }
    environment:
      CASSANDRA_HOSTS: cassandra
      MONGO_URI: mongodb://mongo:27017
    ports: ["4040:4040"]
    command: >
      /opt/spark/bin/spark-submit --master spark://spark-master:7077
      --driver-memory 768m --executor-memory 1g --total-executor-cores 2
      --conf spark.sql.shuffle.partitions=4
      sentinellake/run_stream.py --source kafka --bootstrap kafka:9092
      --lake hdfs://namenode:8020/sentinellake --checkpoint hdfs://namenode:8020/sentinellake/checkpoints
      --serving live --trigger "15 seconds"
    restart: unless-stopped

  # ---------- serving: Cassandra + MongoDB ----------
  cassandra:
    image: cassandra:5.0
    hostname: cassandra
    ports: ["9042:9042"]
    environment:
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: sentinellake
    volumes:
      - cassandra:/var/lib/cassandra
      - ./storage/cassandra:/opt/sentinellake/storage/cassandra:ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 15s
      retries: 20

  cassandra-init:
    image: cassandra:5.0
    depends_on: { cassandra: { condition: service_healthy } }
    volumes: ["./storage/cassandra:/cql:ro"]
    command: cqlsh cassandra -f /cql/schema.cql
    restart: "no"

  mongo:
    image: mongo:7.0
    hostname: mongo
    ports: ["27017:27017"]
    volumes:
      - mongo:/data/db
      - ./storage/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
      - ./storage/mongo:/opt/sentinellake/storage/mongo:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 12

  api:
    <<: *app
    depends_on:
      cassandra-init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
    environment:
      SENTINEL_BACKEND: live
      CASSANDRA_HOSTS: cassandra
      MONGO_URI: mongodb://mongo:27017
    ports: ["8000:8000"]
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # ---------- batch layer (profile: batch) ----------
  resourcemanager:
    <<: *hadoop
    profiles: [batch]
    hostname: resourcemanager
    command: resourcemanager
    ports: ["8088:8088"]

  nodemanager:
    <<: *hadoop
    profiles: [batch]
    hostname: nodemanager
    command: nodemanager
    depends_on: [resourcemanager]

  historyserver:
    <<: *hadoop
    profiles: [batch]
    hostname: historyserver
    command: historyserver
    ports: ["19888:19888"]

  hive:
    <<: *hadoop
    profiles: [batch]
    hostname: hive
    command: hiveserver2
    ports: ["10000:10000", "10002:10002"]
    depends_on: [resourcemanager]
    volumes:
      - ./:/opt/sentinellake:ro
      - hive:/data

volumes:
  namenode:
  datanode:
  cassandra:
  mongo:
  hive:
